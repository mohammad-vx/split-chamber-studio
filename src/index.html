<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: lib:; media-src 'self' blob: lib:; connect-src 'self' lib:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split Chamber Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="wrap">
    <canvas id="stage" aria-label="Simulation"></canvas>

    <div id="hud" class="hidden">
      <span id="hud-session" class="pill"><i></i>Session kept for export</span>
      <span id="hud-hint">Space pause · R restart · Esc menu</span>
    </div>

    <section id="menu" class="panel">
      <div class="brand">
        <svg viewBox="-60 -60 120 120" aria-hidden="true"><circle r="52" fill="none" stroke="currentColor" stroke-width="5"/><g fill="#cfd6e0"><rect x="20" y="-18" width="9" height="36" rx="2"/><rect x="-29" y="-18" width="9" height="36" rx="2"/><rect x="-18" y="20" width="36" height="9" rx="2"/><rect x="-18" y="-29" width="36" height="9" rx="2"/></g><circle r="10" fill="#f2b437"/></svg>
        <h1>Split Chamber</h1>
        <p id="menu-desc">One ball. Four presses. Every hit splits it in three — until there are ten thousand.</p>
      </div>
      <label class="pattern-pick">Pattern <select id="opt-pattern"></select></label>
      <button id="btn-play" class="primary big">Play</button>
      <label class="toggle"><input type="checkbox" id="opt-keep" checked><span></span>Keep session so I can export a video</label>
      <div class="row">
        <button id="btn-open">Open session…</button>
        <button id="btn-folder">Videos folder</button>
      </div>
      <details>
        <summary>Advanced</summary>
        <label>Seed <input id="opt-seed" type="text" inputmode="numeric" placeholder="random"></label>
        <label>Video encoder
          <select id="opt-engine">
            <option value="auto">Automatic (recommended)</option>
            <option value="mb-hw">MediaBunny · WebCodecs hardware</option>
            <option value="ff-hw">FFmpeg · GPU encoder</option>
            <option value="mb-sw">MediaBunny · WebCodecs software</option>
            <option value="ff-x264">FFmpeg · x264 software</option>
          </select>
        </label>
        <label>Quality
          <select id="opt-bitrate">
            <option value="24">High (24 Mbps)</option>
            <option value="32" selected>Very high (32 Mbps)</option>
            <option value="45">Maximum (45 Mbps)</option>
          </select>
        </label>
      </details>
      <button id="btn-exit" class="ghost">← Back to Studio</button>
    </section>

    <section id="paused" class="panel hidden">
      <h2>Paused</h2>
      <button id="btn-resume" class="primary">Resume</button>
      <button id="btn-restart">Restart</button>
      <button id="btn-menu1" class="ghost">Main menu</button>
    </section>

    <section id="end" class="panel hidden">
      <h2 id="end-title">Session complete</h2>
      <p id="end-sub" class="muted"></p>
      <button id="btn-export" class="primary big">Export video</button>
      <div class="row">
        <button id="btn-replay">Replay</button>
        <button id="btn-again">Play again</button>
      </div>
      <button id="btn-save" class="hidden">Save session</button>
      <p id="end-session" class="path"></p>
      <button id="btn-menu2" class="ghost">Main menu</button>
    </section>

    <section id="export" class="panel hidden">
      <h2 id="ex-title">Exporting video</h2>
      <p id="ex-stage" class="muted"></p>
      <div class="bar"><div id="ex-bar"></div></div>
      <p id="ex-stats" class="muted small"></p>
      <div id="ex-result" class="hidden">
        <p class="ok">✓ Saved and verified</p>
        <p id="ex-path" class="path"></p>
        <ul id="ex-summary" class="summary"></ul>
        <button id="btn-show" class="primary">Show in folder</button>
      </div>
      <p id="ex-error" class="error hidden"></p>
      <div class="row">
        <button id="btn-ex-cancel">Cancel</button>
        <button id="btn-ex-done" class="hidden">Done</button>
      </div>
    </section>

    <div id="toast" class="hidden"></div>
  </div>

  <section id="studio" class="studio hidden">
    <header class="st-head">
      <div class="st-brand">
        <svg viewBox="-60 -60 120 120" aria-hidden="true"><circle r="52" fill="none" stroke="currentColor" stroke-width="6"/><g fill="#cfd6e0"><rect x="20" y="-18" width="9" height="36" rx="2"/><rect x="-29" y="-18" width="9" height="36" rx="2"/><rect x="-18" y="20" width="36" height="9" rx="2"/><rect x="-18" y="-29" width="36" height="9" rx="2"/></g><circle r="10" fill="#f2b437"/></svg>
        <div><h1>Split Chamber Studio</h1><div class="st-quota"><div class="bar"><div id="st-quota-bar"></div></div><span id="st-quota"></span></div></div>
      </div>
      <div class="st-buttons">
        <button id="st-live" class="ghost">Live play</button>
        <button id="st-generate" class="primary">+ Generate</button>
      </div>
    </header>
    <div id="st-gen" class="st-gen hidden">
      <label>Pattern <select id="st-pattern"></select></label>
      <label>Videos <input id="st-count" type="number" min="1" max="200" value="3"></label>
      <div id="st-counts" class="row-inline"><button data-n="1">1</button><button data-n="5">5</button><button data-n="10">10</button><button data-n="20">20</button><button data-n="50">50</button></div>
      <label>Text <select id="st-captions"><option value="none">No text</option><option value="en">English</option><option value="ar">العربية</option></select></label>
      <label class="toggle small"><input type="checkbox" id="st-auto"><span></span>Auto-accept score ≥ <input id="st-auto-score" type="number" min="0" max="100" value="80"></label>
      <button id="st-start" class="primary">Start</button>
      <button id="st-gen-cancel" class="ghost">Close</button>
    </div>
    <div id="st-job" class="st-job hidden">
      <div><strong id="st-job-label"></strong> <span id="st-job-stage" class="muted"></span></div>
      <div class="bar"><div id="st-job-progress"></div></div>
      <button id="st-cancel">Stop</button>
    </div>
    <nav class="st-tabs">
      <button id="st-tab-review" class="on">Waiting for review <b>0</b></button>
      <button id="st-tab-accepted">Accepted <b>0</b></button>
      <button id="st-tab-rejected">Rejected <b>0</b></button>
    </nav>
    <div class="st-filters">
      <select id="st-filter-pattern"><option value="">All patterns</option></select>
      <select id="st-sort"><option value="score">Best score</option><option value="new">Newest</option><option value="duration">Longest</option></select>
      <input id="st-search" type="text" placeholder="Seed or id">
      <span id="st-stats" class="muted small"></span>
    </div>
    <div class="st-body">
      <div id="st-grid" class="st-grid"></div>
      <aside id="st-actions" class="st-actions"></aside>
    </div>
    <dialog id="st-player">
      <video id="st-video" controls playsinline></video>
      <p id="st-player-info" class="muted small"></p>
      <button id="st-player-close">Close</button>
    </dialog>
  </section>
  <script type="module" src="ui/app.js"></script>
</body>
</html>
